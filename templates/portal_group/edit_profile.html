{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <h1>Edit profile</h1>

    <form method="post" class="auth-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save changes
        </button>
    </form>

    <p>
        <a href="{% url 'profile' %}">
            ← Back to Profile
        </a>
    </p>

</div>

{% endblock %}
